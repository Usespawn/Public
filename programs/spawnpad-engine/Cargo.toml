[package]
name = "spawnpad-engine"
version = "0.1.0"
description = "Spawnpad (spawn.fun) bonding curve engine — Pump.fun V2-style virtual reserves with enforced Spw vanity mints"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spawnpad_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["metadata", "associated_token", "token"] }
